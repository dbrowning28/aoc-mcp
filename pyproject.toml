[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aoc-mcp"
version = "0.1.0"
description = "A Python project using FastAPI and MCP"
requires-python = ">=3.12"
dependencies = [
    "fastapi==0.110.0",
    "uvicorn==0.30.0",
    "aiohttp==3.9.3",
    "python-dotenv==1.0.1",
    "beautifulsoup4==4.12.3",
    "mcp[cli]==1.2.0",
]

[tool.hatch.metadata]
allow-direct-references = true 
